<!doctype html>
<html lang="pt-PT">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QLD · Amarra | Comunidade AG20 Covilhã</title>

<!-- ícone do separador do browser -->
<link rel="icon" type="image/png" href="icone.png">
<!-- ícone do ecrã principal no iPhone/iPad -->
<link rel="apple-touch-icon" sizes="180x180" href="https://agr20covilha.github.io/amarra/pioneiros_qld/amarra-180-v3.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://agr20covilha.github.io/amarra/pioneiros_qld/amarra-180-v3.png">
<!-- e no Android/Chrome, pelo manifesto -->
<link rel="manifest" href="manifesto.json">
<meta name="theme-color" content="#2A5977">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amarra">
<meta name="robots" content="noindex">

<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2A5977}
  /* O iOS 26 ENCURTA A JANELA — 23-10-2026 (WebKit 301108). No ecrã principal, com a barra
     translúcida, a janela vem mais curta do que o ecrã, a altura das horas, e o que está fixo
     em baixo é cortado: a barra dos separadores sem os nomes e uma faixa da cor da casca por
     baixo (reportado pelo Diogo). O iOS só dá a janela inteira quando a página é pelo menos
     tão alta como o ecrã: a página passa a ter essa altura. O min() evita que, com a barra
     opaca, a página fique a rolar (WebKit 316008). */
  @media (display-mode: standalone){
    html{height:min(100lvh, calc(100% + env(safe-area-inset-top,0px)))}
  }
  /* A APP OCUPA O ECRÃ INTEIRO — 22-10-2026. Até aqui a casca encostava a app por
     baixo das horas e por cima da barra de gestos. O iOS recente passou a dar essas
     medidas também dentro do iframe e a app recuava outra vez: faixas a dobrar, em cima
     e em baixo (reportado pelo Diogo, iPhone pelo ecrã principal). Agora a app vai de
     cima a baixo e a casca diz-lhe as medidas (postMessage «amarra:margens»): quem
     recua é só ela, com o fundo do cabeçalho e da barra de baixo.
     ALTURA EXPLÍCITA (14-10-2026): um iframe não estica entre top e bottom (é um
     elemento substituído). No ecrã principal do iPhone a janela chega a vir mais curta
     do que o ecrã: a altura acerta-se por script (ajustar). */
  iframe{position:fixed;left:0;top:0;width:100%;height:100%;border:0;display:block}
  #medida{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  /* enquanto o Apps Script arranca (costuma demorar 1-2 s na primeira vez) */
  #espera{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:#2A5977;color:#ffffff;
    font:600 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    transition:opacity .35s}
  #espera img{width:76px;height:76px;border-radius:18px}
  #espera.fora{opacity:0;pointer-events:none}
  #plano-b{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#0e1822;color:#c9d5df;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9;white-space:nowrap}
</style>

</head>
<body>
<div id="medida"></div>
<div id="espera"><img src="icone.png" alt=""><span>A abrir a Amarra…</span></div>
<iframe id="app" title="Amarra" data-src="https://script.google.com/a/macros/escutismo.pt/s/AKfycbwG5Ns9QE8tTpMUAqIBqZtQtuK-w84bjr_PYcP-uaaVDfLKl4Rne8nFDw8HY75xGP81/exec"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="plano-b" hidden>Não abriu? Experimente numa janela privada.</div>
<script>
  /* A app avisa quando arrancou (postMessage «amarra:pronta», sem dados).
     Se o aviso não chegar, o que abriu no iframe foi a página de erro do Google
     Drive — acontece no Chrome com várias contas Google com sessão aberta.
     1.º recurso, sozinho: reabrir a app num iframe SEM CREDENCIAIS (Chrome
        110+), como visita anónima — o erro deixa de acontecer; o preço é a
        sessão da app não ficar guardada entre visitas NESSE browser;
     2.º recurso: um aviso, só texto. Nunca uma ligação para o endereço do
        Google: a app abre-se sempre pelo atalho (21-10-2026). */
  var f = document.getElementById('app'), e = document.getElementById('espera'),
      b = document.getElementById('plano-b'), pronta = false, semCredenciais = false;
  var endereco = f.getAttribute('data-src');
  function sair(){ e.className = 'fora'; }
  window.addEventListener('message', function(m){
    if (m && m.data && m.data.amarra === 'pronta') {
      pronta = true; b.hidden = true; sair(); appJanela = m.source; ajustar(); }
  });
  /* as margens do iPhone (horas em cima, barra de gestos em baixo) vão para a app,
     que é quem recua (22-10-2026); e a altura do iframe é a do ecrã */
  var appJanela = null;
  function enviarMargens(){
    if (!appJanela) return;
    var c = getComputedStyle(document.getElementById('medida'));
    try { appJanela.postMessage({amarra:'margens', topo:parseFloat(c.paddingTop) || 0,
                                 base:parseFloat(c.paddingBottom) || 0}, '*'); } catch (err) {}
  }
  /* A altura só se fixa no iPhone pelo ecrã principal, onde a janela vem mais curta do
     que o ecrã. Em todos os outros (Android incluído) fica a do CSS, 100% da janela: é
     o que deixa o teclado encolher a app como deve. */
  function ajustar(){
    var curta = navigator.standalone && window.innerHeight > window.innerWidth && screen.height > window.innerHeight;
    [].forEach.call(document.querySelectorAll('iframe'), function(x){
      if (curta) x.style.height = screen.height + 'px'; else x.style.removeProperty('height'); });
    enviarMargens();
  }
  window.addEventListener('resize', ajustar);
  window.addEventListener('orientationchange', function(){ setTimeout(ajustar, 300); });
  ajustar();
  function vigiar(fr){
    fr.addEventListener('load', function(){
      setTimeout(sair, 250);
      setTimeout(function(){
        if (pronta) return;
        if (!semCredenciais && 'credentialless' in HTMLIFrameElement.prototype) {
          semCredenciais = true;
          var n = document.createElement('iframe');
          n.id = 'app'; n.title = 'Amarra'; n.setAttribute('credentialless', '');
          n.setAttribute('allow', 'clipboard-write; fullscreen');
          n.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
          fr.replaceWith(n); vigiar(n); ajustar(); n.src = endereco;
        } else b.hidden = false;
      }, 5000);
    });
  }
  function arrancar(){
    vigiar(f); f.src = endereco;
    setTimeout(sair, 8000);   /* rede má: mais vale mostrar o que houver */
  }
  /* SÓ ABRE SE A SECÇÃO ESTIVER ABERTA — 15-10-2026 (caderno §5.0-C). Antes de
     carregar a app pergunta-se-lhe se o Chefe já a abriu a todos (estado.js,
     gerado pelo atalho-site.js). Fechada: a página «em breve», que volta para
     aqui sozinha quando abrir. Sem resposta: abre na mesma — quem guarda a
     porta é o servidor, não esta página. */
  /* OS DIRIGENTES ENTRAM SEMPRE — 15-10-2026. Com a app só para dirigentes,
     a página «em breve» tem «Dirigente da secção? Entrar →» (./?dirigente).
     Fica lembrado neste browser (ou neste ícone do ecrã principal, que no iOS
     tem a sua própria memória): o mesmo link passa a abrir a app. Não é uma
     porta: um elemento que carregue ali chega à app e é barrado por ela. */
  var chave = 'amarra-dirigente:' + location.pathname, dirigente = /[?&]dirigente\b/.test(location.search);
  try {
    if (dirigente) { localStorage.setItem(chave, '1'); history.replaceState(null, '', location.pathname); }
    else dirigente = localStorage.getItem(chave) === '1';
  } catch (err) {}
  if (dirigente || !window.AmarraEstado) arrancar();
  else AmarraEstado.perguntar(endereco, function (aberta) {
    if (aberta === false) location.replace('em-breve.html'); else arrancar();
  });
</script>
</body>
</html>
